[package]
name = "mindlite"
version = "1.1.0"
edition = "2021"

[[bin]]
name = "MindLite"
path = "src/main.rs"

[dependencies]
tao = "=0.34.8"
wry = "=0.57.0"
rfd = "=0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
